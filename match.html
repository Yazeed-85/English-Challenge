<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحدي اللغة الإنجليزية | المواجهة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body class="match-body">
    
    <div id="loading-screen" class="full-screen-center">
        <h2>جاري الاتصال بالغرفة...</h2>
        <p id="waiting-msg">إذا كنت المدعو، ننتظر المضيف.</p>
    </div>

    <div id="game-screen" class="game-container" style="display: none;">
        <header class="match-header">
            <div class="player-score" id="p1-score-box">
                <span class="name" id="p1-name">اللاعب 1</span>
                <span class="score" id="p1-score">0</span>
            </div>
            <div class="vs-badge">VS</div>
            <div class="player-score" id="p2-score-box">
                <span class="name" id="p2-name">اللاعب 2</span>
                <span class="score" id="p2-score">0</span>
            </div>
        </header>

        <main class="word-area">
            <div class="word-card" id="english-word">WORD</div>
            <div class="options-grid" id="options-container">
                <!-- سيتم توليد الأزرار هنا -->
            </div>
        </main>
    </div>

    <!-- نافذة الشرح بعد الإجابة -->
    <div id="explanation-popup" class="modal" style="display: none; align-items: center;">
        <div class="modal-content result-content">
            <h1 id="result-status">نتيجة</h1>
            <h2 id="popup-word" class="eng-text">Word</h2>
            <h3 id="popup-meaning" class="ara-text">المعنى</h3>
            <p id="popup-explanation" class="eng-text text-muted"></p>
            <div class="example-box">
                <p id="popup-example" class="eng-text"></p>
            </div>
            <button onclick="playCurrentWordAudio()" class="btn btn-secondary sound-btn">🔊 استمع للكلمة</button>
            <p class="timer-text">السؤال التالي بعد <span id="next-timer">5</span> ثوانٍ...</p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/words.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/match.js"></script>
</body>
</html>
